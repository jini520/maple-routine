<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>메이플 루틴</title>
    <!-- 넥슨 Open API Analytics([[ADR-095]]). 앱 코드는 이 스크립트를 모른다 — 전역을 아무도
         참조하지 않으므로 오프라인·넥슨 장애 시 조용히 실패하고 끝난다. 지표는 넥슨 마이 페이지의
         Analytics 대시보드에서 본다. `src/__tests__/index-html-analytics.test.ts` 가 이 줄을 지킨다. -->
    <script type="text/javascript" src="https://openapi.nexon.com/js/analytics.js?app_id=322698" async></script>
  </head>
  <body>
    <!-- 부팅 커버: 리로드(OTA 적용·디버그 초기화)·콜드 스타트의 첫 페인트부터 앱 준비까지 화면 전체를
         브랜드색으로 덮어 스플래시와 이어지게 한다. 캔버스 배경만 칠하면 테마(비동기 복원) 적용 전
         라이트 기본값으로 그려진 첫 렌더가 노출되므로, 렌더된 콘텐츠까지 덮는 고정 div를 쓴다.
         앱 준비 시 native/splash-screen.ts hideSplashScreen이 제거(ADR-027 정정). -->
    <div id="boot-cover" style="position: fixed; inset: 0; z-index: 2147483647; background-color: #f58b0f"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
