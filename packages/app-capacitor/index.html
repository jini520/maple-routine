<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>메이플 루틴</title>
    <!-- 넥슨 Open API Analytics([[ADR-095]]). 앱 코드는 이 스크립트를 모른다 — 전역을 아무도
         참조하지 않으므로 오프라인·넥슨 장애 시 조용히 실패하고 끝난다. 지표는 넥슨 마이 페이지의
         Analytics 대시보드에서 본다. `src/__tests__/index-html-analytics.test.ts` 가 이 줄을 지킨다. -->
    <script type="text/javascript" src="https://openapi.nexon.com/js/analytics.js?app_id=322698" async></script>
  </head>
  <body>
    <!-- 부팅 커버: 리로드(OTA 적용·디버그 초기화)·콜드 스타트의 첫 페인트부터 앱 준비까지 화면 전체를
         브랜드색으로 덮어 스플래시와 이어지게 한다. 캔버스 배경만 칠하면 테마(비동기 복원) 적용 전
         라이트 기본값으로 그려진 첫 렌더가 노출되므로, 렌더된 콘텐츠까지 덮는 고정 div를 쓴다.
         앱 준비 시 native/splash-screen.ts hideSplashScreen이 제거(ADR-027 정정). -->
    <div id="boot-cover" style="position: fixed; inset: 0; z-index: 2147483647; background-color: #f58b0f"></div>
    <!-- 부팅 커버 실패 안전 타이머(ADR-117 결정 3). 커버를 걷는 코드는 hideSplashScreen() 하나이고 그
         호출은 App.tsx의 useEffect 타이머 안이라 언마운트 클린업이 취소한다 — 앱이 죽으면 커버를 걷을
         주체가 사라져 브랜드색 화면에 갇힌다(iOS는 show()가 건 isUserInteractionEnabled=false 탓에 터치도
         죽어 '벽돌'이 된다). 그래서 이 타이머만 React 트리 밖(문서 셸)에 둔다 — 트리와 함께 죽지 않는
         자리다. 같은 이유로 type="module"이 아닌 고전 스크립트다(모듈은 defer되고 Vite 변환을 탄다 —
         앱 번들이 깨진 상황에서도 반드시 돌아야 한다). src/__tests__/index-html-boot-cover.test.ts가
         이 스크립트를 실제로 실행해 지킨다. -->
    <script>
      setTimeout(function () {
        // `#boot-cover`가 아직 있다 = 부팅이 끝나지 않았다. 이미 걷혔으면(정상 부팅) 아무것도 하지
        // 않는다 — 안 그러면 정상 부팅 8초 뒤에 사용자가 마침 `지금 적용`을 눌러 올라간 리로드
        // 커버까지 걷어버린다(그 구간은 apply()의 12초 타임아웃 몫이다, ADR-117 결정 1).
        var cover = document.getElementById('boot-cover')
        if (!cover) return
        cover.remove()
        // DOM 커버만 걷으면 iOS는 화면만 돌아오고 터치는 죽은 채다 — isUserInteractionEnabled는
        // 네이티브 tearDown()(=hide())에서만 풀린다. 브릿지가 없거나(웹 개발 서버) 아직 준비되지
        // 않았을 수 있어 optional chaining + try/catch로 감싼다.
        try {
          window.Capacitor?.Plugins?.SplashScreen?.hide()
        } catch {}
      }, 8000)
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
